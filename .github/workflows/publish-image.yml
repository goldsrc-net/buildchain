name: Publish build image

# Build the buildchain Docker image (debian:buster / glibc 2.28 floor, gcc-multilib +
# aarch64 cross + arm64 sysroot + cmake 3.29 + Rust/quiche for ENABLE_QUIC) and push it to
# GHCR as ghcr.io/goldsrc-net/buildchain:debian10. Consumer repos (mod-ts, ReHLDS, …) then
# run their Linux CI *inside* this image via `container:` — nobody builds images, they pull.
# Local devs keep using `make image` (same Dockerfile) or pull the same tag.
#
# First run publishes a PRIVATE package (GHCR default). Flip it public once so anonymous
# `container:` pulls work with no credentials:
#   gh api -X PATCH /orgs/goldsrc-net/packages/container/buildchain -f visibility=public

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish-image.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the image picks up base-image (build-containers/debian10) updates.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push ghcr.io/goldsrc-net/buildchain:debian10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # provenance/sbom off: keep a plain single-arch image manifest so `container:`
          # (and `docker pull`) resolve it without attestation-manifest confusion.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/goldsrc-net/buildchain:debian10
            ghcr.io/goldsrc-net/buildchain:debian10-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/goldsrc-net/buildchain
            org.opencontainers.image.description=goldsrc-net buildchain (debian10/glibc-2.28, multilib+aarch64+QUIC)
